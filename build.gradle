plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
loom {
    splitEnvironmentSourceSets()
    mods {
        cycle_paintings {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.shedaniel.me/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    clientRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    clientCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    if (!project.hasProperty('withoutCloth')) {
        clientRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
            exclude group: 'net.fabricmc.fabric-api'
        }
    }
}
def resourceVersion = project.version.toString()
def licenseName = "LICENSE_${project.archives_base_name}"
processResources {
    inputs.property 'version', resourceVersion
    filesMatching('fabric.mod.json') { expand version: resourceVersion }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'cycle_paintings-test'
        enableGameTests = true
        enableClientGameTests = project.hasProperty('clientTests')
        eula = true
    }
}
if (project.hasProperty('clientTests')) {
    sourceSets.gametest.java.srcDir('src/clientTest/java')
    sourceSets.gametest.compileClasspath += sourceSets.client.output
    sourceSets.gametest.compileClasspath += sourceSets.client.compileClasspath
    sourceSets.gametest.runtimeClasspath += sourceSets.client.output
    sourceSets.gametest.runtimeClasspath += sourceSets.client.runtimeClasspath
}
def clientTestsEnabled = project.hasProperty('clientTests')
def withoutCloth = project.hasProperty('withoutCloth')
tasks.named('processGametestResources') {
    inputs.property('clientTests', clientTestsEnabled)
    inputs.property('withoutCloth', withoutCloth)
    if (clientTestsEnabled) {
        doLast {
            def metadataFile = new File(destinationDir, 'fabric.mod.json')
            def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
            metadata.entrypoints['fabric-client-gametest'] = [withoutCloth
                    ? 'net.cycle_paintings.MissingClothClientTest' : 'net.cycle_paintings.ConfigMenuClientTest']
            metadataFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
        }
    }
}
jar { from('LICENSE') { rename { licenseName } } }
